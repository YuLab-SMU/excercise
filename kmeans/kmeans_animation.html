<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>K-means 迭代动画（iris 真实数据）</title>
<style>
  body { font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;
         margin:0; display:flex; height:100vh; color:#1a1a1a; }
  #left { width:66%; background:#fafafa; display:flex; align-items:center; justify-content:center; padding:12px; box-sizing:border-box; }
  #wrap { width:100%; max-width:860px; background:#fff; border:1px solid #e2e2e2; border-radius:8px; padding:10px; }
  canvas { display:block; width:100%; height:560px; }
  #right { width:34%; padding:20px; box-sizing:border-box; background:#fff; border-left:1px solid #eee; overflow:auto; }
  h1 { font-size:18px; margin:0 0 8px; }
  h2 { font-size:14px; margin:18px 0 6px; color:#1f3a5f; }
  p,li,label { font-size:13px; line-height:1.6; color:#333; }
  .row { margin-bottom:12px; }
  input[type=range] { width:100%; }
  button { padding:7px 12px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:13px; margin:0 6px 6px 0; }
  button.primary { background:#1f3a5f; color:#fff; border-color:#1f3a5f; }
  .box { font-family:Consolas,Menlo,monospace; font-size:13px; background:#f4f6f9; border-radius:6px; padding:8px 10px; min-height:40px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:12px; }
  .legend .item { display:flex; align-items:center; gap:5px; }
  .dot { width:12px; height:12px; border-radius:50%; }
  footer { margin-top:14px; font-size:12px; color:#666; }
</style>
</head>
<body>
<div id="left"><div id="wrap"><canvas id="c"></canvas></div></div>
<div id="right">
  <h1>K-means 迭代动画</h1>
  <p>数据是 <code>iris</code> 的 <strong>Sepal.Length × Sepal.Width</strong> 两列（150 朵花、真实测量值）。物种标签默认隐藏：先看算法怎么分组，再打开标签看它把哪两群混在了一起。</p>
  <div class="row">
    <label>聚类数 k：<span id="kval">3</span></label>
    <input id="k" type="range" min="1" max="6" value="3" />
  </div>
  <div class="row">
    <button id="init" class="primary">① 随机初始化中心</button>
    <button id="step">② 走一步</button>
    <button id="run">自动迭代</button>
    <button id="reset">重置</button>
  </div>
  <div class="row"><label><input type="checkbox" id="showsp" /> 显示真实物种标签（金＝setosa，深蓝边＝versicolor，黑边＝virginica）</label></div>
  <h2>当前状态</h2>
  <div class="box" id="status">点「随机初始化中心」开始。</div>
  <h2>组内平方和</h2>
  <div class="box" id="wss">—</div>
  <p style="color:#666;font-size:12px">每次「更新」之后组内平方和只会下降或不变。肘部法则画的就是这条曲线随 k 的变化，而每一个点都是这样一个数字。</p>
  <div class="legend" id="legend"></div>
  <footer>初始中心随机，所以同一个 k 每次跑出来可能不同——上机要求你用 <code>set.seed()</code> 固定后重跑三次，比较分组是否稳定。</footer>
</div>
<script>
const IRIS = {
  sl: [5.1,4.9,4.7,4.6,5,5.4,4.6,5,4.4,4.9,5.4,4.8,4.8,4.3,5.8,5.7,5.4,5.1,5.7,5.1,5.4,5.1,4.6,5.1,4.8,5,5,5.2,5.2,4.7,4.8,5.4,5.2,5.5,4.9,5,5.5,4.9,4.4,5.1,5,4.5,4.4,5,5.1,4.8,5.1,4.6,5.3,5,7,6.4,6.9,5.5,6.5,5.7,6.3,4.9,6.6,5.2,5,5.9,6,6.1,5.6,6.7,5.6,5.8,6.2,5.6,5.9,6.1,6.3,6.1,6.4,6.6,6.8,6.7,6,5.7,5.5,5.5,5.8,6,5.4,6,6.7,6.3,5.6,5.5,5.5,6.1,5.8,5,5.6,5.7,5.7,6.2,5.1,5.7,6.3,5.8,7.1,6.3,6.5,7.6,4.9,7.3,6.7,7.2,6.5,6.4,6.8,5.7,5.8,6.4,6.5,7.7,7.7,6,6.9,5.6,7.7,6.3,6.7,7.2,6.2,6.1,6.4,7.2,7.4,7.9,6.4,6.3,6.1,7.7,6.3,6.4,6,6.9,6.7,6.9,5.8,6.8,6.7,6.7,6.3,6.5,6.2,5.9],
    sw: [3.5,3,3.2,3.1,3.6,3.9,3.4,3.4,2.9,3.1,3.7,3.4,3,3,4,4.4,3.9,3.5,3.8,3.8,3.4,3.7,3.6,3.3,3.4,3,3.4,3.5,3.4,3.2,3.1,3.4,4.1,4.2,3.1,3.2,3.5,3.6,3,3.4,3.5,2.3,3.2,3.5,3.8,3,3.8,3.2,3.7,3.3,3.2,3.2,3.1,2.3,2.8,2.8,3.3,2.4,2.9,2.7,2,3,2.2,2.9,2.9,3.1,3,2.7,2.2,2.5,3.2,2.8,2.5,2.8,2.9,3,2.8,3,2.9,2.6,2.4,2.4,2.7,2.7,3,3.4,3.1,2.3,3,2.5,2.6,3,2.6,2.3,2.7,3,2.9,2.9,2.5,2.8,3.3,2.7,3,2.9,3,3,2.5,2.9,2.5,3.6,3.2,2.7,3,2.5,2.8,3.2,3,3.8,2.6,2.2,3.2,2.8,2.8,2.7,3.3,3.2,2.8,3,2.8,3,2.8,3.8,2.8,2.8,2.6,3,3.4,3.1,3,3.1,3.1,3.1,2.7,3.2,3.3,3,2.5,3,3.4,3],
    sp: ["setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","setosa","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","versicolor","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica","virginica"]
};
const COLORS = ['#E07B39','#2A9D8F','#5B6FCF','#A06CD5','#D98B63','#20615E'];
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status'), wssEl = document.getElementById('wss');
const kInput = document.getElementById('k'), kLabel = document.getElementById('kval');
const showSp = document.getElementById('showsp');
let pts = [], cents = [], assign = [], k = 3, phase = 'idle', iter = 0, timer = null;
const PAD = 44;

document.getElementById('legend').innerHTML = COLORS.map((c,i) =>
  `<div class="item"><span class="dot" style="background:${c}"></span>簇 ${i+1}</div>`).join('')
  + '<div class="item"><span class="dot" style="background:#111;border-radius:2px"></span>中心</div>';

const dpr = () => window.devicePixelRatio || 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.floor(r.width * dpr());
  canvas.height = Math.floor(r.height * dpr());
  draw();
}
window.addEventListener('resize', resize);
const bounds = () => ({ x0: Math.min(...pts.map(p=>p.x)), x1: Math.max(...pts.map(p=>p.x)),
                        y0: Math.min(...pts.map(p=>p.y)), y1: Math.max(...pts.map(p=>p.y)) });
const sx = (v,b,w) => PAD + (v-b.x0)/(b.x1-b.x0)*(w-2*PAD);
const sy = (v,b,h) => h-PAD - (v-b.y0)/(b.y1-b.y0)*(h-2*PAD);

function reset() {
  clearInterval(timer); timer = null;
  pts = IRIS.sl.map((v,i) => ({ x:v, y:IRIS.sw[i], sp:IRIS.sp[i] }));
  cents = []; assign = new Array(pts.length).fill(-1); phase = 'idle'; iter = 0;
  statusEl.textContent = '点「随机初始化中心」开始。'; wssEl.textContent = '—'; draw();
}
function initCents() {
  const b = bounds(); cents = [];
  for (let i = 0; i < k; i++) cents.push({ x: b.x0 + Math.random()*(b.x1-b.x0),
                                           y: b.y0 + Math.random()*(b.y1-b.y0) });
  assign = new Array(pts.length).fill(-1); phase = 'cents'; iter = 0;
  statusEl.textContent = `已随机放置 ${k} 个中心。下一步：把每个点分给离它最近的中心。`;
  wssEl.textContent = '—'; draw();
}
function assignStep() {
  if (!cents.length) return;
  let moved = 0;
  assign = pts.map((p,i) => {
    let best = 0, bestD = Infinity;
    cents.forEach((c,j) => { const d = (p.x-c.x)**2 + (p.y-c.y)**2; if (d < bestD) { bestD = d; best = j; } });
    if (assign[i] !== best) moved++;
    return best;
  });
  phase = 'assigned';
  statusEl.textContent = `分配完成：每个点归到最近的中心，本轮有 ${moved} 个点换了归属。下一步：把中心移到各自簇的均值处。`;
  draw();
}
function updateStep() {
  if (phase !== 'assigned') return;
  const s = cents.map(() => ({ x:0, y:0, n:0 }));
  pts.forEach((p,i) => { const a = assign[i]; if (a >= 0) { s[a].x += p.x; s[a].y += p.y; s[a].n++; } });
  cents = s.map((v,j) => v.n ? { x:v.x/v.n, y:v.y/v.n } : cents[j]);
  iter++;
  const wss = pts.reduce((acc,p,i) => { const c = cents[assign[i]];
    return acc + (p.x-c.x)**2 + (p.y-c.y)**2; }, 0);
  phase = 'updated';
  statusEl.textContent = `第 ${iter} 次更新完成：中心移到了簇内均值。再走一步会重新分配。`;
  wssEl.textContent = `组内平方和 = ${wss.toFixed(2)}（第 ${iter} 次更新后）`;
  draw();
}
const step = () => { if (phase === 'idle' || phase === 'cents') assignStep();
                     else if (phase === 'assigned') updateStep(); else assignStep(); };

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); ctx.scale(dpr(), dpr());
  const w = W/dpr(), h = H/dpr();
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  if (!pts.length) return;
  const b = bounds();
  ctx.strokeStyle = '#cfd8e3'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, h-PAD); ctx.lineTo(w-PAD, h-PAD);
  ctx.moveTo(PAD, PAD); ctx.lineTo(PAD, h-PAD); ctx.stroke();
  ctx.fillStyle = '#6b7280'; ctx.font = '12px system-ui';
  ctx.fillText('Sepal.Length →', w-PAD-96, h-PAD+26);
  ctx.save(); ctx.translate(14, PAD+110); ctx.rotate(-Math.PI/2); ctx.fillText('Sepal.Width →', 0, 0); ctx.restore();
  ctx.fillText(b.x0.toFixed(1), PAD-6, h-PAD+16);
  ctx.fillText(b.x1.toFixed(1), w-PAD-20, h-PAD+16);
  pts.forEach((p,i) => {
    const a = assign[i];
    ctx.beginPath();
    ctx.fillStyle = (showSp.checked && p.sp === 'setosa') ? '#E8C05B'
                  : (a >= 0 ? COLORS[a % COLORS.length] : '#b8c4d4');
    ctx.arc(sx(p.x,b,w), sy(p.y,b,h), 4, 0, Math.PI*2); ctx.fill();
    if (showSp.checked && p.sp !== 'setosa') {
      ctx.strokeStyle = p.sp === 'versicolor' ? '#1f3a5f' : '#111';
      ctx.lineWidth = 1.2; ctx.stroke();
    }
  });
  cents.forEach((c,j) => {
    const X = sx(c.x,b,w), Y = sy(c.y,b,h);
    ctx.fillStyle = '#111'; ctx.fillRect(X-7, Y-7, 14, 14);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(String(j+1), X, Y+4); ctx.textAlign = 'start';
  });
}
kInput.addEventListener('input', e => { k = +e.target.value; kLabel.textContent = k; reset(); });
document.getElementById('init').addEventListener('click', initCents);
document.getElementById('step').addEventListener('click', step);
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('run').addEventListener('click', () => {
  clearInterval(timer);
  timer = setInterval(() => { if (phase === 'idle') { clearInterval(timer); return; } step(); }, 700);
});
showSp.addEventListener('change', draw);
reset(); resize();
</script>
</body>
</html>
